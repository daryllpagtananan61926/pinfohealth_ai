# Dependency Review Configuration
# See: https://github.com/actions/dependency-review-action

# Allow-listed licenses (adjust as needed)
license-allowlist:
  - MIT
  - ISC
  - BSD-2-Clause
  - BSD-3-Clause
  - Apache-2.0
  - Unlicense
  - CC0-1.0
  - Zlib

# Block licenses
license-blocklist:
  - GPL-3.0-only
  - AGPL-3.0-only
  - SSPL-1.0

# Severity thresholds
fail-on-severity: high
allow-ghsas:
  - "GHSA-67mh-4wv8-2f99"  # Dev-only esbuild in vite 5.x; no fix without Vite 8

# Ignore specific vulnerabilities (use sparingly, with justification)
ignored-vulnerabilities:
  - id: "GHSA-67mh-4wv8-2f99"
    justification: "Dev-only esbuild vulnerability in vite 5.x; no fix without breaking upgrade to Vite 8 (incompatible with @vitejs/plugin-react@4). Affects dev server only, not production."