version: 2
updates:
  # Backend dependencies
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    reviewers:
      - "daryllpagtananan"  # replace with your GitHub username
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(backend)"
    ignore:
      # Ignore major version upgrades for core frameworks until tested
      - dependency-name: "fastify"
        update-type: "version-update:semver-major"
      - dependency-name: "pg"
        update-type: "version-update:semver-major"

  # Frontend dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    open-pull-requests-limit: 10
    reviewers:
      - "daryllpagtananan"
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(frontend)"
    ignore:
      - dependency-name: "react"
        update-type: "version-update:semver-major"
      - dependency-name: "vite"
        update-type: "version-update:semver-major"